name: dedup-review

on:
  schedule:
    - cron: "0 14 * * 0"   # 매주 일요일 23:00 KST
  workflow_dispatch:

jobs:
  dedup:
    name: dedup 분석 및 큐 저장
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run dedup analysis
        run: npx tsx scripts/dedup-review.ts > dedup-queue.csv
      - uses: actions/upload-artifact@v4
        with:
          name: dedup-queue-${{ github.run_id }}
          path: dedup-queue.csv
          retention-days: 14
