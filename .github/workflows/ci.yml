name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:seo
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          TURSO_DATABASE_URL: file:ci.db
          TURSO_AUTH_TOKEN: placeholder
          NEXT_PUBLIC_SITE_URL: https://campgogo.kr
