name: bulk-collect

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "COLLECT_CAMPGOGO_BULK 입력"
        type: string
        required: true
      dry_run:
        description: "Dry run (데이터 저장 안 함)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: campgogo-bulk-collect
  cancel-in-progress: false

jobs:
  collect:
    name: 고캠핑 전체 수집
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      GOCAMPING_API_KEY: ${{ secrets.GOCAMPING_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate explicit confirmation
        env:
          COLLECT_CONFIRMATION: ${{ inputs.confirm }}
        run: |
          if [ "$COLLECT_CONFIRMATION" != "COLLECT_CAMPGOGO_BULK" ]; then
            echo "Exact confirmation is required."
            exit 1
          fi
      - name: Run collect
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            npm run collect:dry
          else
            npm run collect
          fi
      - name: Notify on failure
        if: failure()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          if [ -n "$SLACK_WEBHOOK" ]; then
            curl --fail --show-error -X POST "$SLACK_WEBHOOK" \
              -H 'Content-Type: application/json' \
              -d "{\"text\":\"❌ bulk-collect 실패: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
          fi
